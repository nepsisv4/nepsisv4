[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"          # v4 requires the transient-storage (TSTORE) opcodes
optimizer = true
optimizer_runs = 800
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

# RPC endpoints are read from your environment. Never commit keys.
[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
